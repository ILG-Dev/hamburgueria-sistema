<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Novo Produto - Hamburgueria</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #111827; }
        label { display: block; margin-top: 16px; font-weight: bold; }
        input[type="text"], input[type="number"] { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        .checkbox-linha { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
        .checkbox-linha label { margin: 0; }
        button { margin-top: 24px; padding: 10px 20px; background-color: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>
<div th:replace="~{menu :: menu}"></div>
<h1>Novo Produto</h1>

<form th:action="@{/produtos/salvar}" th:object="${produto}" method="post">
    <label for="nome">Nome</label>
    <input type="text" id="nome" th:field="*{nome}" required>

    <label for="descricao">Descrição</label>
    <input type="text" id="descricao" th:field="*{descricao}">

    <label for="preco">Preço</label>
    <input type="number" id="preco" step="0.01" th:field="*{preco}" required>

    <label for="categoria">Categoria</label>
    <input type="text" id="categoria" th:field="*{categoria}" placeholder="lanche, bebida, sobremesa">

    <div class="checkbox-linha">
        <input type="checkbox" id="disponivel" th:field="*{disponivel}">
        <label for="disponivel">Disponível no cardápio</label>
    </div>

    <button type="submit">Salvar</button>
</form>
</body>
</html>
