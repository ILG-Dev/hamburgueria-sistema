<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Novo Pedido - Hamburgueria</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #111827; }
        label { display: block; margin-top: 16px; font-weight: bold; }
        select { width: 100%; padding: 8px; margin-top: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e5e7eb; }
        th { background-color: #111827; color: white; }
        input[type="number"] { width: 70px; padding: 6px; }
        button { margin-top: 24px; padding: 10px 20px; background-color: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>
<div th:replace="~{menu :: menu}"></div>
<h1>Novo Pedido</h1>

<form th:action="@{/pedidos/salvar}" method="post">
    <label for="clienteId">Cliente</label>
    <select id="clienteId" name="clienteId" required>
        <option value="">Selecione...</option>
        <option th:each="cliente : ${clientes}" th:value="${cliente.id}" th:text="${cliente.nome}"></option>
    </select>

    <table>
        <thead>
        <tr>
            <th>Produto</th>
            <th>Preço</th>
            <th>Quantidade</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="produto : ${produtos}">
            <td th:text="${produto.nome}"></td>
            <td th:text="${'R$ ' + produto.preco}"></td>
            <td>
                <input type="hidden" name="produtoId" th:value="${produto.id}">
                <input type="number" name="quantidade" min="0" value="0">
            </td>
        </tr>
        </tbody>
    </table>

    <button type="submit">Criar Pedido</button>
</form>
</body>
</html>
