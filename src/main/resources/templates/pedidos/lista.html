<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pedidos - Hamburgueria</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #111827; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e5e7eb; }
        th { background-color: #111827; color: white; }
        .btn { padding: 6px 14px; border-radius: 4px; text-decoration: none; font-size: 0.9rem; }
        .btn-novo { background-color: #2563eb; color: white; display: inline-block; margin-bottom: 20px; }
        .btn-deletar { background-color: #dc2626; color: white; }
    </style>
</head>
<body>
<div th:replace="~{menu :: menu}"></div>
<h1>Pedidos</h1>
<a class="btn btn-novo" th:href="@{/pedidos/novo}">+ Novo Pedido</a>

<table>
    <thead>
    <tr>
        <th>Cliente</th>
        <th>Data/Hora</th>
        <th>Status</th>
        <th>Total</th>
        <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="pedido : ${pedidos}">
        <td th:text="${pedido.cliente.nome}"></td>
        <td th:text="${#temporals.format(pedido.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
        <td th:text="${pedido.status}"></td>
        <td th:text="${'R$ ' + pedido.valorTotal}"></td>
        <td>
            <a class="btn btn-deletar" th:href="@{/pedidos/deletar/{id}(id=${pedido.id})}">Excluir</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
